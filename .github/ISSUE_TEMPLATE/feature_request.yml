name: 功能建议
description: 想要的新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景，而不是直接说方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的设想
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索过 Issue，没有重复
          required: true
